<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FamSchicht">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FamSchicht</title>
<style>
#startup{max-width:720px;margin:36px auto;padding:22px;font:16px system-ui,sans-serif;color:#163d32;background:#e9f5ef;border-radius:14px}
#startup code{overflow-wrap:anywhere}#startup button{padding:10px;border-radius:8px}
</style>
</head>
<body>
<div id="startup" role="status" aria-live="polite">
<strong>FamSchicht wird geladen …</strong>
<p id="startup-detail">Falls diese Meldung stehen bleibt, werden die App-Dateien nicht korrekt geladen.</p>
<button id="retry" type="button" onclick="location.reload()">Erneut laden</button>
</div>
<section id="account-shell" aria-label="Konto und Haushalt">
  <div class="account-intro">
    <button id="close-account-settings" class="account-close" type="button" aria-label="Einstellungen schließen">×</button>
    <span class="account-mark">F</span>
    <div>
      <p class="account-eyebrow">FamSchicht</p>
      <h1>Dein Familienplan</h1>
      <p>Gemeinsame Termine, Kinder und Dienste an einem Ort.</p>
    </div>
  </div>
  <div class="account-panels">
    <section id="auth" aria-label="Anmeldung"></section>
    <section id="household" class="panel" aria-label="Familienhaushalt"></section>
    <section id="custody-settings" aria-label="Umgangsrhythmus"></section>
  </div>
</section>
<main id="app"></main>
<script>
(function(){
function report(message){
 var el=document.getElementById('startup'),detail=document.getElementById('startup-detail');
 if(el&&detail){el.style.display='block';detail.textContent='Startfehler: '+message;}
}
window.addEventListener('error',function(e){report(e.message||'Eine App-Datei konnte nicht geladen werden.');});
window.addEventListener('unhandledrejection',function(e){report(e.reason&&e.reason.message||'Ein Modul konnte nicht gestartet werden.');});
window.__famschichtReady=function(){var el=document.getElementById('startup');if(el)el.style.display='none';};
})();
</script>
<script type="module" src="./src/auth-ui.js?v=0.3.2"></script>
<script type="module" src="./src/household-ui.js?v=0.3.2"></script>
<script type="module" src="./src/main.js?v=0.3.2"></script>
</body>
</html>
